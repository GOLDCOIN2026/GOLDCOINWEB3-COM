/* ================= PARTICLES ================= */
#particles {
    position: fixed;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, #1a1a1a, #000);

.particle {

}
@keyframes floatUp {

    100% { transform: translateY(-10vh) scale(1.1); opacity: 0; }
}

/* ================= ICON ================= */

    100% { transform: scale(1); opacity: 1; }
}

}
