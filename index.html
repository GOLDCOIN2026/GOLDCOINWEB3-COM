/* ---------------- PARTICLES ---------------- */
#particles {
    position: fixed;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, #1a1a1a, #000);
    z-index: -1;
}
.particle {
    position: absolute;
    background: rgba(255, 215, 0, 0.7);
    border-radius: 50%;
    box-shadow: 0 0 10px gold;
    animation: floatUp 8s linear infinite;
    filter: blur(1px);
}
@keyframes floatUp {
    0% { transform: translateY(100vh) scale(0.4); opacity: 0.3; }
    100% { transform: translateY(-10vh) scale(1.1); opacity: 0; }
}

/* ---------------- ICON SMALL ---------------- */
.icon {
    width: 70px;
    margin-top: 25px;
    filter: drop-shadow(0 0 10px gold);
    animation: popIn 1.2s ease-out;
}
@keyframes popIn {
    0% { transform: scale(0.4); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}

/* ---------------- TITLE ---------------- */
.title {
    margin-top: 10px;
    font-size: 58px;
    font-weight: 800;
    background: linear-gradient(90deg, #ffe08a, #fff3c4, #ffe08a);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: glowTitle 2s infinite alternate;
}
@keyframes glowTitle {
    0% { text-shadow: 0 0 10px #ffcf40; }
    100% { text-shadow: 0 0 25px #ffdd55; }
}

/* ---------------- SLIDESHOW ---------------- */
.slideshow-container {

}
.slideshow-container img {
    width: 350px;
    height: 350px;
    border-radius: 30px;
    position: absolute;
    opacity: 0;
    transform: rotateY(90deg) scale(1.15);
    transition: opacity 1.3s, transform 1.3s;
    box-shadow: 0 0 25px gold;
}
.slideshow-container img.active {
    opacity: 1;
    transform: rotateY(0deg) scale(1);
}

/* ---------------- BIO ---------------- */

<script>
let slides = document.querySelectorAll(".slideshow-container img");
